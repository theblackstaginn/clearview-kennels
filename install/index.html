<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Install Clearview Kennels</title>
  <meta
    name="description"
    content="Install Clearview Kennels on your Android home screen."
  />
  <meta
    name="robots"
    content="noindex,follow"
  />
  <meta
    name="theme-color"
    content="#354735"
  />

  <link
    rel="manifest"
    href="/manifest.webmanifest?v=20261002-1"
  />

  <link
    rel="icon"
    type="image/webp"
    href="/ck-icons/apple-touch-icon.webp"
  />

  <link
    rel="apple-touch-icon"
    href="/ck-icons/apple-touch-icon.webp"
  />

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --forest: #354735;
      --forest-deep: #273628;
      --cream: #f4efe5;
      --ink: #29291f;
      --ink-soft: #615846;
      --white: #fffdf8;
      --serif: "Libre Baskerville", Georgia, serif;
      --sans: "DM Sans", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100dvh;
      padding:
        max(24px, env(safe-area-inset-top))
        20px
        max(24px, env(safe-area-inset-bottom));
      place-items: center;
      color: var(--ink);
      background:
        linear-gradient(
          rgba(28, 39, 29, .48),
          rgba(28, 39, 29, .58)
        ),
        url("/ck-assets/ck-mobile-bg.webp")
          center / cover fixed no-repeat;
      font-family: var(--sans);
    }

    .install-shell {
      width: min(100%, 440px);
    }

    .install-card {
      position: relative;
      overflow: hidden;
      padding: 30px 24px 24px;
      border: 1px solid rgba(92,72,46,.22);
      border-radius: 18px;
      background:
        linear-gradient(
          rgba(247,242,232,.94),
          rgba(247,242,232,.94)
        ),
        url("/ck-assets/ck-paper-mobile.webp")
          center / cover no-repeat;
      box-shadow:
        0 24px 60px rgba(10,15,10,.3);
      text-align: center;
    }

    .install-card::before {
      content: "";
      position: absolute;
      top: 20px;
      left: 50%;
      width: 56px;
      height: 1px;
      background: rgba(126,96,58,.48);
      transform: translateX(-50%);
    }

    .eyebrow {
      margin: 8px 0 10px;
      color: var(--ink-soft);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      color: var(--forest-deep);
      font-family: var(--serif);
      font-size: clamp(1.9rem, 8vw, 2.6rem);
      font-weight: 400;
      line-height: 1.08;
    }

    .install-copy {
      max-width: 32ch;
      margin: 0 auto 24px;
      color: var(--ink-soft);
      font-size: .96rem;
      font-weight: 600;
      line-height: 1.55;
    }

    .install-button {
      width: 100%;
      min-height: 54px;
      padding: 14px 20px;
      color: var(--white);
      border: 1px solid var(--forest);
      border-radius: 12px;
      background: var(--forest);
      box-shadow: 0 9px 18px rgba(41,41,31,.16);
      font: inherit;
      font-size: .76rem;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        background .2s ease,
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;
    }

    .install-button:hover:not(:disabled) {
      background: var(--forest-deep);
      transform: translateY(-1px);
      box-shadow: 0 11px 22px rgba(41,41,31,.2);
    }

    .install-button:disabled {
      cursor: default;
      opacity: .55;
    }

    .status {
      min-height: 1.4em;
      margin: 14px 0 0;
      color: var(--ink-soft);
      font-size: .76rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .home-link {
      display: inline-block;
      margin-top: 18px;
      color: rgba(255,253,248,.88);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .home-link:hover {
      color: #fff;
    }

    .ios-help-overlay {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      padding:
        max(24px, env(safe-area-inset-top))
        20px
        max(24px, env(safe-area-inset-bottom));
      place-items: center;
      background: rgba(18, 25, 19, .72);
    }

    .ios-help-card {
      width: min(100%, 420px);
      padding: 28px 24px 24px;
      border: 1px solid rgba(92,72,46,.22);
      border-radius: 18px;
      background:
        linear-gradient(
          rgba(247,242,232,.97),
          rgba(247,242,232,.97)
        ),
        url("/ck-assets/ck-paper-mobile.webp")
          center / cover no-repeat;
      box-shadow:
        0 24px 60px rgba(10,15,10,.32);
      text-align: left;
    }

    .ios-help-card h2 {
      margin: 0 0 12px;
      color: var(--forest-deep);
      font-family: var(--serif);
      font-size: 1.65rem;
      font-weight: 400;
      line-height: 1.15;
    }

    .ios-help-card ol {
      margin: 0 0 20px;
      padding-left: 22px;
      color: var(--ink);
      font-size: .95rem;
      font-weight: 700;
      line-height: 1.55;
    }

    .ios-help-card li + li {
      margin-top: 8px;
    }

    .ios-help-tip {
      margin: 0 0 20px;
      color: var(--ink-soft);
      font-size: .82rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .ios-help-close {
      width: 100%;
      min-height: 48px;
      padding: 12px 18px;
      color: var(--white);
      border: 1px solid var(--forest);
      border-radius: 12px;
      background: var(--forest);
      font: inherit;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      .install-button {
        transition: none;
      }

      .install-button:hover:not(:disabled) {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main class="install-shell">
    <section
      class="install-card"
      aria-labelledby="installTitle"
    >
      <p class="eyebrow">
        Clearview Kennels
      </p>

      <h1 id="installTitle">
        Add Clearview to your home screen
      </h1>

      <p class="install-copy">
        Keep available puppies, updates, and contact info one tap away.
      </p>

      <button
        id="installButton"
        class="install-button"
        type="button"
        disabled
      >
        Preparing install...
      </button>

      <p
        id="installStatus"
        class="status"
        role="status"
        aria-live="polite"
      >
        Open this page in Chrome on Android.
      </p>
    </section>

    <div style="text-align:center">
      <a
        class="home-link"
        href="/"
      >
        Back to Clearview Kennels
      </a>
    </div>
  </main>

  <script>
    (function () {
      const installButton =
        document.getElementById(
          "installButton"
        );

      const installStatus =
        document.getElementById(
          "installStatus"
        );

      const isAndroid =
        /Android/i.test(
          navigator.userAgent || ""
        );

      const isStandalone =
        window.matchMedia(
          "(display-mode: standalone)"
        ).matches ||
        window.navigator.standalone === true;

      let deferredPrompt = null;

      if ("serviceWorker" in navigator) {
        window.addEventListener(
          "load",
          () => {
            navigator.serviceWorker
              .register("/service-worker.js")
              .catch(() => {});
          }
        );
      }

      function showReadyState() {
        installButton.disabled = false;
        installButton.textContent =
          "Install Clearview App";
        installStatus.textContent =
          "Tap the button once. Android will handle the rest.";
      }

      function showManualAndroidHelp() {
        installButton.disabled = false;
        installButton.textContent =
          "How to install";
        installStatus.textContent =
          "Chrome has not offered the install yet.";
      }

      if (isStandalone) {
        installButton.hidden = true;
        installStatus.textContent =
          "Clearview is already installed on this device.";
        return;
      }

      const isIOS =
        /iPad|iPhone|iPod/i.test(
          navigator.userAgent || ""
        );

      const isFirefoxIOS =
        /FxiOS/i.test(
          navigator.userAgent || ""
        );

      if (isIOS) {
        installButton.disabled = false;
        installButton.textContent =
          "Show me how";
        installStatus.textContent =
          isFirefoxIOS
            ? "Firefox can add Clearview from the Share menu."
            : "Use your browser's Share menu to add Clearview.";
      } else if (!isAndroid) {
        installButton.disabled = false;
        installButton.textContent =
          "How to add Clearview";
        installStatus.textContent =
          "Use your browser's install or Add to Home Screen option.";
      }

      window.addEventListener(
        "beforeinstallprompt",
        event => {
          event.preventDefault();
          deferredPrompt = event;
          showReadyState();
        }
      );

      window.addEventListener(
        "appinstalled",
        () => {
          deferredPrompt = null;
          installButton.hidden = true;
          installStatus.textContent =
            "Clearview is installed. Look for the Clearview icon on your home screen.";
        }
      );

      installButton.addEventListener(
        "click",
        async () => {
          if (deferredPrompt) {
            try {
              deferredPrompt.prompt();

              const choice =
                await deferredPrompt.userChoice;

              if (
                choice &&
                choice.outcome === "accepted"
              ) {
                installStatus.textContent =
                  "Installing Clearview...";
              } else {
                installStatus.textContent =
                  "No problem. Tap Install Clearview App whenever you're ready.";
              }
            } catch (error) {
              showManualAndroidHelp();
            } finally {
              deferredPrompt = null;
            }

            return;
          }

          if (isAndroid) {
            installStatus.innerHTML =
              "In Chrome, tap <strong>⋮</strong> in the upper-right, then <strong>Install app</strong> or <strong>Add to Home screen</strong>.";
            return;
          }

          if (isIOS) {
            const overlay =
              document.createElement("div");

            overlay.className =
              "ios-help-overlay";

            overlay.innerHTML = `
              <section
                class="ios-help-card"
                role="dialog"
                aria-modal="true"
                aria-labelledby="iosHelpTitle"
              >
                <h2 id="iosHelpTitle">
                  Add Clearview to your Home Screen
                </h2>

                <ol>
                  <li>
                    Tap the <strong>Share</strong> button
                    in your browser toolbar.
                  </li>
                  <li>
                    Tap <strong>Add to Home Screen</strong>.
                  </li>
                  <li>
                    Tap <strong>Add</strong>.
                  </li>
                </ol>

                <p class="ios-help-tip">
                  In Firefox on iPhone, the Share button is the box-with-arrow icon in the address bar.
                </p>

                <button
                  type="button"
                  class="ios-help-close"
                >
                  Got it
                </button>
              </section>
            `;

            document.body.appendChild(
              overlay
            );

            const closeButton =
              overlay.querySelector(
                ".ios-help-close"
              );

            closeButton.addEventListener(
              "click",
              () => overlay.remove()
            );

            overlay.addEventListener(
              "click",
              event => {
                if (event.target === overlay) {
                  overlay.remove();
                }
              }
            );

            closeButton.focus();
            return;
          }

          installStatus.innerHTML =
            "Open your browser menu and choose <strong>Install app</strong> or <strong>Add to Home Screen</strong>.";
        }
      );

      if (isAndroid) {
        window.setTimeout(
          () => {
            if (!deferredPrompt) {
              showManualAndroidHelp();
            }
          },
          3500
        );
      }
    })();
  </script>
</body>
</html>
