name: Review Clearview metadata batch 01

on:
  push:
    branches:
      - ll-review-clearview-batch01-20261020
    paths:
      - ".github/workflows/ll-review-clearview-batch01.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Render original vs staged comparison pairs
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          python - <<'PY'
          import io, json, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageOps

          summary=json.loads(Path("studio/clearview-client-metadata-last-result.json").read_text())
          targets=summary["updated_paths"]
          out=Path("studio/review-renders/clearview-batch01")
          out.mkdir(parents=True,exist_ok=True)

          def checker(size,block=20):
              bg=Image.new("RGB",size,(205,205,205))
              d=ImageDraw.Draw(bg)
              for y in range(0,size[1],block):
                  for x in range(0,size[0],block):
                      if ((x//block)+(y//block))%2:
                          d.rectangle((x,y,min(x+block-1,size[0]-1),min(y+block-1,size[1]-1)),fill=(235,235,235))
              return bg

          def prep(raw):
              im=Image.open(io.BytesIO(raw))
              im=ImageOps.exif_transpose(im).convert("RGBA")
              im.thumbnail((720,620),Image.Resampling.LANCZOS)
              bg=checker(im.size)
              bg.paste(im,(0,0),im)
              return bg

          manifest=[]
          for path in targets:
              original_raw=subprocess.check_output(["git","show",f"origin/main:{path}"])
              staged_raw=Path(path).read_bytes()
              a=prep(original_raw)
              b=prep(staged_raw)
              top=34
              gap=12
              canvas=Image.new("RGB",(a.width+b.width+gap,max(a.height,b.height)+top),(35,35,35))
              d=ImageDraw.Draw(canvas)
              d.text((8,8),"ORIGINAL MAIN",fill=(240,240,240))
              d.text((a.width+gap+8,8),"STAGED METADATA",fill=(240,240,240))
              canvas.paste(a,(0,top))
              canvas.paste(b,(a.width+gap,top))
              dest=out/(Path(path).name.replace(".","_")+"-pair.webp")
              canvas.save(dest,"WEBP",quality=90,method=6)
              manifest.append({"path":path,"render":str(dest)})
          (out/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY

      - name: Commit review-only renders
        shell: bash
        run: |
          git config user.name "L&L Review Render Bot"
          git config user.email "actions@users.noreply.github.com"
          git add studio/review-renders/clearview-batch01
          git commit -m "review: add Clearview batch one comparison renders"
          git push
